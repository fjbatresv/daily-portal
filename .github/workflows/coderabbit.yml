name: CodeRabbit Config

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  validate-config:
    name: Validate CodeRabbit config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate YAML
        run: ruby -e "require 'yaml'; YAML.load_file('.coderabbit.yaml')"
