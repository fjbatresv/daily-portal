name: Snyk Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Monday at 07:00 UTC to catch newly disclosed vulnerabilities
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  snyk-dependencies:
    name: Snyk — Workspace dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository and inspect manifests
      issues: write # upsert the Snyk summary comment on pull requests
      pull-requests: write # allow PR comment writes when repository settings require it

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Snyk — test workspace dependencies
        id: snyk
        uses: snyk/actions/node@8e119fbb6c251787721d34ba683ed48eba792766
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: >
            --all-projects
            --detection-depth=3
            --severity-threshold=high
            --json-file-output=snyk-results.json

      - name: Comment Snyk result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        run: node .github/scripts/comment-snyk-result.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNYK_SCAN_OUTCOME: ${{ steps.snyk.outcome }}

      - name: Fail when Snyk scan failed
        if: steps.snyk.outcome == 'failure'
        run: exit 1

      - name: Snyk — monitor workspace (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: snyk/actions/node@8e119fbb6c251787721d34ba683ed48eba792766
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: >
            --all-projects
            --detection-depth=3
